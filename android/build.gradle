buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['VeonPrebidReactNative_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["VeonPrebidReactNative_" + name]).toInteger()
}

android {
  namespace "com.setupadprebidreactnative"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()

  // JitPack repository for Veon Prebid SDK
  maven { url 'https://jitpack.io' }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

configurations.configureEach {
  // Prebid core still pulls legacy play-services-ads transitively for its *LegacyGam loaders,
  // which we don't use. Its base API stub (play-services-ads-api) duplicates the
  // com.google.android.gms.ads.* classes already bundled in the Next-Gen ads-mobile-sdk,
  // causing "Duplicate class" build failures. Drop the legacy stub — mirrors PrebidVeonNextGenDemo.
  exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
}

dependencies {
  // React Native
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // Google Mobile Ads — Next-Gen GMA SDK. Backs Prebid's NextGen multi-loaders
  // (api/multiloadernextgen) and the NextGen GAM event handlers used for the waterfall fallback.
  // Replaces the legacy play-services-ads: the two GMA SDKs cannot coexist (they both ship the
  // base com.google.android.gms.ads.* classes).
  implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:0.25.0-beta01'

  // Veon Prebid SDK (Next-Gen)
  implementation 'com.github.veonadtech.prebid-android-sdk:core:0.4.2'
  implementation 'com.github.veonadtech.prebid-android-sdk:eventhandlers.nextgen:0.4.2'
  implementation 'com.github.veonadtech.prebid-android-sdk:mobile:0.4.2'
  implementation 'com.github.veonadtech.prebid-android-sdk:prebidorg:0.4.2'

  // Test dependencies
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.mockito:mockito-inline:5.2.0'
  testImplementation 'org.mockito.kotlin:mockito-kotlin:5.3.1'
}
